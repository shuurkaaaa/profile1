<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Social links profile</title>
     <link rel="stylesheet" href="profile1.css">
     <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;800&display=swap">
</head>
<body>
     <main class="card">
          <header class="person-description">
               <figure class="avatar">
                    <img src="pictures/avatar-jessica.jpeg" alt="" class="avatar">
               </figure>
               <h2 class="name">Jessica Randall</h2>
               <address class="owner-address">London, United Kingdom</address>
               <p class="status">"Front-end developer and avid reader"</p>
          </header>
          <nav class="nav-card">
               <ul>
                    <li> <a href="#">GitHub</a></li>
                    <li><a href="#">Frontend Mentor</a></li>
                    <li><a href="#">LinkedIn</a></li>
                    <li><a href="#">Instagram</a></li>
                    <li><a href="#">Twitter</a></li>
               
               </ul>
          </nav>
     </main>
</body>
</html>
